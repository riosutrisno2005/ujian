<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ujian</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #b9fbc0 0%, #70e000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1C1C1E;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
        }

        .icon-badge {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(0, 100, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #1b5e20;
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            stroke-width: 1.8;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 14px;
            color: #334155;
            line-height: 1.4;
            max-width: 90%;
        }

        /* --- Kartu Form (gaya kaca, senada dengan halaman utama) --- */
        .form-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 8px 32px rgba(0, 100, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #14532d;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.75);
            font-size: 16px;
            color: #0f172a;
            outline: none;
        }

        .field input:focus {
            border-color: #1b5e20;
            background: #ffffff;
        }

        .btn-masuk {
            margin-top: 4px;
            padding: 15px 16px;
            border: none;
            border-radius: 14px;
            background: #1b5e20;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn-masuk:active {
            transform: scale(0.97);
            background: #14532d;
        }

        .btn-masuk[disabled] {
            opacity: 0.6;
            cursor: default;
        }

        .pesan-error {
            display: none;
            font-size: 13px;
            color: #b91c1c;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(185, 28, 28, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .pesan-error.tampil {
            display: block;
        }

        /* --- Layar setelah login berhasil --- */
        .berhasil {
            display: none;
            text-align: center;
            padding: 32px 20px;
        }

        .berhasil.tampil {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .berhasil h2 {
            font-size: 20px;
            color: #0f172a;
        }

        .berhasil p {
            font-size: 14px;
            color: #334155;
        }
    </style>
</head>
<body>

    <div class="app-container" id="layar-login">
        <header>
            <div class="icon-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
            </div>
            <h1>Masuk Ujian</h1>
            <p>Isi Nama dan NISN kamu.</p>
        </header>

        <form class="form-card" id="form-login" onsubmit="return prosesLogin(event)">
            <div class="field">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Contoh: Budi Santoso" autocomplete="off" required>
            </div>

            <div class="field">
                <label for="nomor_ujian">NISN (Nomor Induk Siswa Nasional)</label>
                <input type="password" id="nomor_ujian" inputmode="numeric" placeholder="Contoh: 231045" autocomplete="off" required>
            </div>

            <div class="pesan-error" id="pesan-error"></div>

            <button type="submit" class="btn-masuk" id="btn-masuk">Masuk</button>
        </form>
    </div>

    <div class="app-container berhasil" id="layar-berhasil">
        <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h2>Selamat mengerjakan, <span id="nama-siswa"></span></h2>
        <p>Halaman soal akan tampil di sini.</p>
    </div>

    <script>
        /*
          GANTI dengan URL Firebase Realtime Database kamu sendiri.
          Contoh struktur data yang diharapkan di Firebase:

          peserta_ujian: {
            "231045": { "nama": "Budi Santoso", "kelas": "XII RPL 1" },
            "231046": { "nama": "Siti Aminah",  "kelas": "XII RPL 1" }
          }

          Key ("231045") adalah nomor ujian, dipakai sebagai "password".
        */
        const FIREBASE_URL = "https://ujian-smk-6c744-default-rtdb.firebaseio.com/";

        function tampilkanError(pesan) {
            const kotak = document.getElementById('pesan-error');
            kotak.textContent = pesan;
            kotak.classList.add('tampil');
        }

        function sembunyikanError() {
            const kotak = document.getElementById('pesan-error');
            kotak.classList.remove('tampil');
        }

        function kirimKeAppInventor(dataObjek) {
            const teks = JSON.stringify(dataObjek);
            if (window.AppInventor) {
                window.AppInventor.setWebViewString(teks);
            } else {
                console.log("Kirim ke App Inventor:", teks);
            }
        }

        async function prosesLogin(event) {
            event.preventDefault();
            sembunyikanError();

            const nama = document.getElementById('nama').value.trim();
            const nomorUjian = document.getElementById('nomor_ujian').value.trim();
            const tombol = document.getElementById('btn-masuk');

            if (!nama || !nomorUjian) {
                tampilkanError("Nama dan nomor ujian wajib diisi.");
                return false;
            }

            tombol.disabled = true;
            tombol.textContent = "Memeriksa...";

            try {
                const response = await fetch(`${FIREBASE_URL}/peserta_ujian/${nomorUjian}.json`);
                const data = await response.json();

                if (!data) {
                    tampilkanError("Nomor ujian tidak ditemukan. Periksa kembali nomor kamu.");
                    tombol.disabled = false;
                    tombol.textContent = "Masuk";
                    return false;
                }

                const namaTercocok = data.nama.trim().toLowerCase() === nama.toLowerCase();

                if (!namaTercocok) {
                    tampilkanError("Nama tidak cocok dengan nomor ujian ini.");
                    tombol.disabled = false;
                    tombol.textContent = "Masuk";
                    return false;
                }

                // Login berhasil
                document.getElementById('layar-login').style.display = 'none';
                document.getElementById('layar-berhasil').classList.add('tampil');
                document.getElementById('nama-siswa').textContent = data.nama;

                kirimKeAppInventor({
                    status: "ok",
                    peran: "siswa",
                    nama: data.nama,
                    nomor_ujian: nomorUjian
                });

            } catch (err) {
                tampilkanError("Gagal terhubung ke server. Periksa koneksi internet.");
                tombol.disabled = false;
                tombol.textContent = "Masuk";
            }

            return false;
        }
    </script>
</body>
</html>
