<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Admin</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #b9fbc0 0%, #70e000 100%); min-height: 100vh; color: #1C1C1E; padding: 16px; }
    .app-container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; padding: 8px 0 4px; }
    header h1 { font-size: 22px; font-weight: 700; color: #0f172a; }
    header p { font-size: 13px; color: #14532d; margin-top: 4px; }
    .card { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 18px; padding: 16px; box-shadow: 0 8px 32px rgba(0, 100, 0, 0.1); display: flex; flex-direction: column; gap: 10px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-header b { font-size: 15px; color: #0f172a; }
    .card-header span { font-size: 12px; color: #475569; display: block; margin-top: 2px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .badge-aktif { background: #dcfce7; color: #166534; }
    .badge-nonaktif { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .kotak-token { background: rgba(27,94,32,0.08); border: 1px dashed #1b5e20; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .kotak-token .kode { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #14532d; }
    .btn-utama, .btn-sekunder, .btn-bahaya { padding: 12px 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-utama { background: #1b5e20; color: #fff; }
    .btn-sekunder { background: rgba(255,255,255,0.85); color: #1b5e20; border: 1px solid #1b5e20; }
    .btn-bahaya { background: #fff; color: #b91c1c; border: 1px solid rgba(185,28,28,0.4); }
    .kosong { text-align: center; font-size: 13px; color: #475569; padding: 20px 0; }
    .pesan-status { display: none; font-size: 13px; padding: 10px 12px; border-radius: 10px; text-align: center; }
    .pesan-status.tampil { display: block; }
    .pesan-status.sukses { background: rgba(220,252,231,0.9); color: #166534; }
    .pesan-status.gagal { background: rgba(254,226,226,0.9); color: #991b1b; }
    .pesan-status.info { background: rgba(219,234,254,0.9); color: #1e40af; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #14532d; margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.8); font-size: 15px; color: #0f172a; outline: none; font-family: inherit; }
    .field textarea.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; min-height: 220px; white-space: pre; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 999; }
    .popup-overlay.tampil { display: flex; }
    .popup-box { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .popup-box h3 { font-size: 17px; color: #0f172a; }
    .baris-tombol { display: flex; gap: 8px; flex-wrap: wrap; }
    .baris-tombol > * { flex: 1; min-width: 110px; }
    .tab-nav { display: flex; gap: 6px; background: rgba(255,255,255,0.55); padding: 6px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.8); flex-wrap: wrap; }
    .tab-nav button { padding: 10px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px; background: transparent; color: #14532d; cursor: pointer; flex: 1; min-width: 90px; }
    .tab-nav button.aktif { background: #1b5e20; color: #fff; }
    .item-siswa { background: rgba(241,245,249,0.9); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .item-siswa b { font-size: 14px; color: #0f172a; }
    .item-siswa span { font-size: 12px; color: #475569; }
    .statistik { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #14532d; }
    .statistik span { background: rgba(255,255,255,0.85); padding: 3px 9px; border-radius: 8px; }
    .kelas-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(255,255,255,0.6); border-radius: 12px; gap: 8px; }
    .kelas-item span { font-size: 14px; color: #0f172a; font-weight: 600; flex: 1; }
</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Dashboard Admin</h1>
        <p id="info-admin">Selamat datang</p>
    </header>

    <div class="pesan-status" id="pesan-status"></div>

    <div class="tab-nav">
        <button id="tab-btn-mapel" class="aktif" onclick="gantiTab('mapel')">📚 Mapel</button>
        <button id="tab-btn-kelas" onclick="gantiTab('kelas')">🏫 Kelas</button>
        <button id="tab-btn-guru" onclick="gantiTab('guru')">👤 Guru</button>
    </div>

    <!-- TAB MAPEL -->
    <div id="tab-mapel" style="display:flex;flex-direction:column;gap:16px;">
        <button class="btn-sekunder" onclick="lihatRekapToken()">🔑 Rekap Token Aktif (share WA)</button>
        <div id="daftar-mapel"></div>
    </div>

    <!-- TAB KELAS -->
    <div id="tab-kelas" style="display:none;flex-direction:column;gap:16px;">
        <div class="card">
            <div class="field">
                <label>Nama Kelas</label>
                <input type="text" id="input-nama-kelas" placeholder="Contoh: X TKJ 1">
            </div>
            <button class="btn-utama" onclick="tambahKelas()">+ Tambah Kelas</button>
        </div>
        <div id="daftar-kelas"></div>
    </div>

    <!-- TAB GURU -->
    <div id="tab-guru" style="display:none;flex-direction:column;gap:16px;">
        <div class="card">
            <h3 id="judul-form-guru" style="color:#0f172a;font-size:16px;">Tambah Akun Guru</h3>
            <div class="field"><label>Username</label><input type="text" id="input-username-guru" placeholder="mis. budi"></div>
            <div class="field"><label>Nama Lengkap</label><input type="text" id="input-nama-guru" placeholder="mis. Budi Santoso, S.Pd."></div>
            <div class="field"><label>Password</label><input type="text" id="input-password-guru" placeholder="password"></div>
            <div class="baris-tombol">
                <button class="btn-sekunder" onclick="resetFormGuru()">Reset</button>
                <button class="btn-utama" onclick="simpanGuru()">Simpan Akun</button>
            </div>
        </div>
        <div id="daftar-guru"></div>
    </div>
</div>

<!-- POPUP PENGERJAAN / REKAP -->
<div class="popup-overlay" id="popup-pengerjaan">
    <div class="popup-box">
        <h3 id="judul-pengerjaan">Rekap</h3>
        <div class="field" id="filter-kelas-box" style="display:none;">
            <label>Filter Kelas</label>
            <select id="pilih-filter-kelas" onchange="terapkanFilterKelas()"><option value="">Semua Kelas</option></select>
        </div>
        <div id="daftar-pengerjaan"></div>
        <button class="btn-sekunder" onclick="tutupPopup('popup-pengerjaan')">Tutup</button>
    </div>
</div>

<!-- POPUP PENGAJUAN -->
<div class="popup-overlay" id="popup-pengajuan">
    <div class="popup-box">
        <h3 id="judul-pengajuan">Pengajuan Ujian Ulang</h3>
        <div id="daftar-pengajuan"></div>
        <button class="btn-sekunder" onclick="tutupPopup('popup-pengajuan')">Tutup</button>
    </div>
</div>

<!-- POPUP NILAI ESSAY -->
<div class="popup-overlay" id="popup-nilai-essay">
    <div class="popup-box">
        <h3 id="judul-nilai-essay">Nilai Essay</h3>
        <div id="isi-nilai-essay"></div>
        <div class="baris-tombol">
            <button class="btn-sekunder" onclick="tutupPopup('popup-nilai-essay')">Batal</button>
            <button class="btn-utama" onclick="simpanNilaiEssay()">Simpan</button>
        </div>
    </div>
</div>

<!-- POPUP EXPORT CSV -->
<div class="popup-overlay" id="popup-export">
    <div class="popup-box">
        <h3 id="judul-export">Export CSV</h3>
        <p style="font-size:12px;color:#475569;">Klik <b>Copy Semua</b> lalu paste ke Excel / Google Sheets.</p>
        <div class="field"><textarea id="isi-export-csv" class="mono" readonly></textarea></div>
        <div class="baris-tombol">
            <button class="btn-sekunder" onclick="tutupPopup('popup-export')">Tutup</button>
            <button class="btn-utama" onclick="copyExportCSV()">📋 Copy Semua</button>
        </div>
    </div>
</div>

<!-- POPUP KONFIRMASI -->
<div class="popup-overlay" id="popup-konfirmasi">
    <div class="popup-box" style="text-align:center;">
        <h3 id="judul-konfirmasi">Konfirmasi</h3>
        <p id="pesan-konfirmasi" style="font-size:14px;color:#475569;line-height:1.5;"></p>
        <div class="baris-tombol">
            <button class="btn-sekunder" onclick="tutupKonfirmasi(false)">Batal</button>
            <button class="btn-utama" id="btn-ok-konfirmasi" onclick="tutupKonfirmasi(true)">Ya</button>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://ujian-smk-6c744-default-rtdb.firebaseio.com";

    let usernameAdmin = "", namaAdmin = "";
    let daftarMapel = [], daftarGuru = [], daftarKelas = [];
    let konteksNilaiEssay = { mapelId: null, nisn: null };
    let rekapSekarang = { mapelId: null, semuaData: [] };

    let resolveKonfirmasi = null;
    function konfirmasi(pesan, judul, labelOk) {
        judul = judul || 'Konfirmasi';
        labelOk = labelOk || 'Ya';
        return new Promise(resolve => {
            document.getElementById('judul-konfirmasi').textContent = judul;
            document.getElementById('pesan-konfirmasi').textContent = pesan;
            document.getElementById('btn-ok-konfirmasi').textContent = labelOk;
            document.getElementById('popup-konfirmasi').classList.add('tampil');
            resolveKonfirmasi = resolve;
        });
    }
    function tutupKonfirmasi(hasil) {
        document.getElementById('popup-konfirmasi').classList.remove('tampil');
        if (resolveKonfirmasi) { resolveKonfirmasi(hasil); resolveKonfirmasi = null; }
    }
    function tutupPopup(id) { document.getElementById(id).classList.remove('tampil'); }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
    function escapeCSV(v) {
        const s = String(v == null ? '' : v);
        if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\t') || s.includes(';')) return '"' + s.replace(/"/g, '""') + '"';
        return s;
    }
    function copyTextarea(id) {
        const ta = document.getElementById(id);
        ta.focus(); ta.select();
        if (ta.setSelectionRange) ta.setSelectionRange(0, 99999);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        if (!ok && navigator.clipboard) { try { navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {} }
        return ok;
    }
    function parseKelasList(k) {
        if (!k) return [];
        if (Array.isArray(k)) return k.filter(x => x && typeof x === 'string');
        if (typeof k === 'string') return k.split(',').map(s => s.trim()).filter(s => s);
        if (typeof k === 'object') return Object.values(k).filter(x => typeof x === 'string');
        return [];
    }

    function ambilParamAtauTanya() {
        const params = new URLSearchParams(window.location.search);
        usernameAdmin = (params.get('username') || '').trim().toLowerCase();
        namaAdmin = params.get('nama') || '';
        if (!usernameAdmin) {
            usernameAdmin = (prompt('Testing: username admin') || '').trim().toLowerCase();
            namaAdmin = usernameAdmin;
        }
        document.getElementById('info-admin').textContent = 'Selamat datang, ' + (namaAdmin || usernameAdmin);
    }
    function tampilkanStatus(pesan, jenis) {
        jenis = jenis || 'info';
        const k = document.getElementById('pesan-status');
        k.textContent = pesan; k.className = 'pesan-status tampil ' + jenis;
        setTimeout(() => k.classList.remove('tampil'), 3500);
    }
    function buatTokenAcak() {
        const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let h = '';
        for (let i = 0; i < 6; i++) h += c.charAt(Math.floor(Math.random() * c.length));
        return h;
    }

    function gantiTab(tab) {
        ['mapel','kelas','guru'].forEach(t => {
            document.getElementById('tab-btn-' + t).classList.toggle('aktif', t === tab);
            document.getElementById('tab-' + t).style.display = t === tab ? 'flex' : 'none';
        });
        if (tab === 'kelas') muatKelas();
        if (tab === 'guru') muatDaftarGuru();
    }

    // ======================= TAB MAPEL =======================
    async function muatDaftarMapel() {
        try {
            const [r1, r2, r3] = await Promise.all([
                fetch(`${FIREBASE_URL}/mapel.json`),
                fetch(`${FIREBASE_URL}/hasil_ujian.json`),
                fetch(`${FIREBASE_URL}/pengajuan_ulang.json`)
            ]);
            const data = await r1.json();
            const dataHasil = await r2.json();
            const dataUlang = await r3.json();
            daftarMapel = [];
            if (data) {
                for (const id in data) {
                    const h = dataHasil ? dataHasil[id] : null;
                    const u = dataUlang ? dataUlang[id] : null;
                    let menunggu = 0;
                    if (u) for (const nis in u) if (u[nis].status === 'menunggu') menunggu++;
                    daftarMapel.push({
                        id, ...data[id],
                        jumlah_hasil: h ? Object.keys(h).length : 0,
                        jumlah_pengajuan_menunggu: menunggu
                    });
                }
            }
            renderDaftarMapel();
        } catch (e) { tampilkanStatus('Gagal memuat daftar mapel.', 'gagal'); }
    }

    function renderDaftarMapel() {
        const k = document.getElementById('daftar-mapel');
        if (daftarMapel.length === 0) { k.innerHTML = '<p class="kosong">Belum ada mapel.</p>'; return; }
        k.innerHTML = daftarMapel.map(m => {
            const kelasList = parseKelasList(m.kelas);
            return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <b>${escapeHtml(m.nama_mapel)}</b>
                        <span>Guru: ${escapeHtml(m.guru)}</span>
                        <span>Kelas: ${kelasList.length ? kelasList.map(escapeHtml).join(', ') : '-'}</span>
                    </div>
                    <span class="badge ${m.status_aktif ? 'badge-aktif' : 'badge-nonaktif'}">
                        ${m.status_aktif ? 'Aktif' : 'Nonaktif'}
                    </span>
                </div>
                <div class="statistik">
                    <span>${m.jumlah_pg || 0} PG</span>
                    <span>${m.jumlah_essay || 0} Essay</span>
                    <span>${m.jumlah_hasil} siswa</span>
                    ${m.jumlah_pengajuan_menunggu > 0 ? `<span class="badge badge-info">${m.jumlah_pengajuan_menunggu} pengajuan</span>` : ''}
                </div>
                ${m.status_aktif && m.token ? `
                    <div class="kotak-token">
                        <span>Token:</span>
                        <span class="kode">${m.token}</span>
                    </div>` : ''}
                <div class="baris-tombol">
                    ${m.status_aktif
                        ? `<button class="btn-bahaya" onclick="nonaktifkanMapel('${m.id}')">Nonaktifkan</button>
                           <button class="btn-sekunder" onclick="rilisTokenBaru('${m.id}', '${escapeHtml(m.nama_mapel)}')">Ganti Token</button>`
                        : `<button class="btn-utama" onclick="rilisTokenBaru('${m.id}', '${escapeHtml(m.nama_mapel)}')">Rilis Token</button>`
                    }
                </div>
                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="lihatRekapNilai('${m.id}', '${escapeHtml(m.nama_mapel)}')">👥 Rekap Nilai</button>
                    <button class="btn-sekunder" onclick="lihatPengajuan('${m.id}', '${escapeHtml(m.nama_mapel)}')">📩 Pengajuan</button>
                </div>
                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="unduhHasil('${m.id}', '${escapeHtml(m.nama_mapel)}')">📊 Export CSV</button>
                    <button class="btn-bahaya" onclick="hapusMapelAdmin('${m.id}', '${escapeHtml(m.nama_mapel)}')">🗑️ Hapus</button>
                </div>
            </div>`;
        }).join('');
    }

    async function rilisTokenBaru(id, nama) {
        const token = buatTokenAcak();
        const ya = await konfirmasi(`Rilis token baru untuk "${nama}"?\n\nToken: ${token}`, 'Rilis Token', 'Ya');
        if (!ya) return;
        try {
            const res = await fetch(`${FIREBASE_URL}/mapel/${id}.json`, {
                method: 'PATCH', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status_aktif: true, token })
            });
            if (!res.ok) throw new Error('fail');
            tampilkanStatus(`Token dirilis: ${token}`, 'sukses');
            muatDaftarMapel();
        } catch (e) { tampilkanStatus('Gagal merilis token.', 'gagal'); }
    }

    async function nonaktifkanMapel(id) {
        const ya = await konfirmasi('Nonaktifkan mapel ini? Siswa yang sedang ujian akan otomatis keluar.', 'Nonaktifkan', 'Ya');
        if (!ya) return;
        try {
            const res = await fetch(`${FIREBASE_URL}/mapel/${id}.json`, {
                method: 'PATCH', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status_aktif: false, token: '' })
            });
            if (!res.ok) throw new Error();
            tampilkanStatus('Mapel dinonaktifkan.', 'sukses');
            muatDaftarMapel();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }

    async function hapusMapelAdmin(id, nama) {
        const ya = await konfirmasi(`Hapus mapel "${nama}"?\nSemua soal, hasil, dan pengajuan ikut terhapus.`, 'Hapus Mapel', 'Ya, Hapus');
        if (!ya) return;
        try {
            await Promise.allSettled([
                fetch(`${FIREBASE_URL}/mapel/${id}.json`, { method: 'DELETE' }),
                fetch(`${FIREBASE_URL}/hasil_ujian/${id}.json`, { method: 'DELETE' }),
                fetch(`${FIREBASE_URL}/pengajuan_ulang/${id}.json`, { method: 'DELETE' }),
                fetch(`${FIREBASE_URL}/draft_soal/${id}.json`, { method: 'DELETE' })
            ]);
            tampilkanStatus('Mapel berhasil dihapus.', 'sukses');
            muatDaftarMapel();
        } catch (e) { tampilkanStatus('Gagal menghapus.', 'gagal'); }
    }

    // ======================= REKAP NILAI PER KELAS =======================
    async function lihatRekapNilai(mapelId, namaMapel) {
        document.getElementById('judul-pengerjaan').textContent = 'Rekap: ' + namaMapel;
        const k = document.getElementById('daftar-pengerjaan');
        k.innerHTML = '<p class="kosong">Memuat...</p>';
        document.getElementById('filter-kelas-box').style.display = 'block';
        document.getElementById('popup-pengerjaan').classList.add('tampil');

        try {
            const res = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}.json`);
            const data = await res.json();
            if (!data || Object.keys(data).length === 0) {
                k.innerHTML = '<p class="kosong">Belum ada siswa mengumpulkan.</p>';
                document.getElementById('pilih-filter-kelas').innerHTML = '<option value="">Semua Kelas</option>';
                return;
            }
            const list = Object.keys(data).map(nis => ({ nis, ...data[nis] }));
            list.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            rekapSekarang = { mapelId, semuaData: list };

            const kelasUnik = [...new Set(list.map(h => h.kelas).filter(Boolean))].sort();
            document.getElementById('pilih-filter-kelas').innerHTML =
                '<option value="">Semua Kelas</option>' +
                kelasUnik.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            document.getElementById('pilih-filter-kelas').value = '';
            renderRekapNilai();
        } catch (e) { k.innerHTML = '<p class="kosong">Gagal memuat.</p>'; }
    }

    function terapkanFilterKelas() { renderRekapNilai(); }

    function renderRekapNilai() {
        const kelasPilih = document.getElementById('pilih-filter-kelas').value;
        const list = rekapSekarang.semuaData.filter(h => !kelasPilih || (h.kelas || '') === kelasPilih);
        const k = document.getElementById('daftar-pengerjaan');
        if (list.length === 0) { k.innerHTML = '<p class="kosong">Tidak ada data untuk kelas ini.</p>'; return; }
        k.innerHTML = list.map(h => {
            const status = h.status === 'dinilai_guru'
                ? '<span class="badge badge-aktif">Sudah Dinilai Guru</span>'
                : (h.status === 'selesai' ? '<span class="badge badge-aktif">Selesai</span>' : '<span class="badge badge-info">Menunggu Nilai Essay</span>');
            return `
                <div class="item-siswa">
                    <div><b>${escapeHtml(h.nama || '-')}</b> ${status}</div>
                    <span>NISN: ${escapeHtml(h.nisn || h.nis || '-')} &middot; Kelas: ${escapeHtml(h.kelas || '-')}</span>
                    <div class="statistik">
                        <span>PG: ${h.benar_pg || 0}/${h.total_pg || 0} (${h.nilai_pg || 0})</span>
                        <span>Essay: ${h.nilai_essay != null ? h.nilai_essay : '-'}</span>
                        <span>Akhir: ${h.nilai_akhir != null ? h.nilai_akhir : '-'}</span>
                    </div>
                    ${h.total_essay > 0 ? `
                        <div class="baris-tombol">
                            <button class="btn-sekunder" onclick="bukaNilaiEssay('${rekapSekarang.mapelId}','${escapeHtml(h.nisn || h.nis || '')}')">✍️ Lihat Essay</button>
                        </div>` : ''}
                </div>`;
        }).join('');
    }

    async function bukaNilaiEssay(mapelId, nisn) {
        konteksNilaiEssay = { mapelId, nisn };
        document.getElementById('judul-nilai-essay').textContent = 'Essay — ' + nisn;
        const k = document.getElementById('isi-nilai-essay');
        k.innerHTML = '<p class="kosong">Memuat...</p>';
        document.getElementById('popup-nilai-essay').classList.add('tampil');
        try {
            const [r1, r2] = await Promise.all([
                fetch(`${FIREBASE_URL}/mapel/${mapelId}/soal.json`),
                fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`)
            ]);
            const soal = await r1.json() || {};
            const hasil = await r2.json() || {};
            const je = hasil.jawaban_essay || {};
            let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
            let ada = 0;
            for (const sid in soal) {
                if (soal[sid].tipe !== 'essay') continue;
                ada++;
                html += `<div class="item-siswa">
                    <b>${escapeHtml(soal[sid].pertanyaan)}</b>
                    ${soal[sid].kunci_essay ? `<span style="color:#166534;">Kunci: ${escapeHtml(soal[sid].kunci_essay)}</span>` : ''}
                    <div style="background:#fff;border-radius:8px;padding:8px;font-size:13px;">${escapeHtml(je[sid] || '(kosong)')}</div>
                </div>`;
            }
            if (ada === 0) html += '<p class="kosong">Tidak ada soal essay.</p>';
            html += `<div class="field">
                <label>Nilai Essay (0-100)</label>
                <input type="number" id="input-nilai-essay" min="0" max="100" value="${hasil.nilai_essay != null ? hasil.nilai_essay : ''}" style="text-align:center;font-weight:700;">
            </div></div>`;
            k.innerHTML = html;
        } catch (e) { k.innerHTML = '<p class="kosong">Gagal.</p>'; }
    }

    async function simpanNilaiEssay() {
        const { mapelId, nisn } = konteksNilaiEssay;
        const nilai = parseInt(document.getElementById('input-nilai-essay').value, 10);
        if (isNaN(nilai) || nilai < 0 || nilai > 100) { alert('Nilai 0-100.'); return; }
        try {
            const r = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`);
            const h = await r.json() || {};
            const tp = h.total_pg || 0, te = h.total_essay || 0, np = h.nilai_pg || 0;
            const na = (tp + te) === 0 ? 0 : Math.round((np * tp + nilai * te) / (tp + te));
            await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`, {
                method: 'PATCH', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ nilai_essay: nilai, nilai_akhir: na, status: 'selesai' })
            });
            tutupPopup('popup-nilai-essay');
            tampilkanStatus('Nilai tersimpan.', 'sukses');
            lihatRekapNilai(mapelId, 'Mapel');
        } catch (e) { alert('Gagal.'); }
    }

    // ======================= PERSETUJUAN =======================
    async function lihatPengajuan(mapelId, namaMapel) {
        document.getElementById('judul-pengajuan').textContent = 'Pengajuan: ' + namaMapel;
        const k = document.getElementById('daftar-pengajuan');
        k.innerHTML = '<p class="kosong">Memuat...</p>';
        document.getElementById('popup-pengajuan').classList.add('tampil');
        try {
            const r = await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}.json`);
            const data = await r.json();
            if (!data || Object.keys(data).length === 0) { k.innerHTML = '<p class="kosong">Tidak ada pengajuan.</p>'; return; }
            const list = Object.keys(data).map(nis => ({ nis, ...data[nis] }));
            list.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            const adaMenunggu = list.some(p => p.status === 'menunggu');
            let html = '';
            if (adaMenunggu) html += `<div class="baris-tombol"><button class="btn-utama" onclick="setujuiSemua('${mapelId}')">✅ Setujui Semua</button></div>`;
            html += list.map(p => {
                let b = '', a = '';
                if (p.status === 'menunggu') {
                    b = '<span class="badge badge-info">Menunggu</span>';
                    a = `<div class="baris-tombol">
                        <button class="btn-bahaya" onclick="putuskanUlang('${mapelId}','${escapeHtml(p.nis)}','ditolak')">Tolak</button>
                        <button class="btn-utama" onclick="putuskanUlang('${mapelId}','${escapeHtml(p.nis)}','disetujui')">Setujui</button>
                    </div>`;
                } else if (p.status === 'disetujui') b = '<span class="badge badge-aktif">Disetujui</span>';
                else b = '<span class="badge badge-nonaktif">Ditolak</span>';
                return `<div class="item-siswa">
                    <div><b>${escapeHtml(p.nama||'-')}</b> ${b}</div>
                    <span>NISN: ${escapeHtml(p.nisn||p.nis||'-')} · ${escapeHtml(p.kelas||'-')}</span>
                    <span>${escapeHtml(p.waktu||'-')}</span>
                    ${p.alasan ? `<span>Alasan: ${escapeHtml(p.alasan)}</span>` : ''}
                    ${a}
                </div>`;
            }).join('');
            k.innerHTML = html;
        } catch (e) { k.innerHTML = '<p class="kosong">Gagal.</p>'; }
    }

    async function putuskanUlang(mapelId, nisn, keputusan) {
        const ya = await konfirmasi(keputusan === 'disetujui' ? 'Setujui?' : 'Tolak?', 'Konfirmasi', 'Ya');
        if (!ya) return;
        try {
            await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}/${nisn}.json`, {
                method: 'PATCH', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ status: keputusan, waktu_keputusan: new Date().toLocaleString('id-ID') })
            });
            if (keputusan === 'disetujui') {
                await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`, { method: 'DELETE' });
            }
            tampilkanStatus('Tersimpan.', 'sukses');
            lihatPengajuan(mapelId, 'Mapel');
            muatDaftarMapel();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }

    async function setujuiSemua(mapelId) {
        const ya = await konfirmasi('Setujui semua pengajuan menunggu?', 'Setujui Semua', 'Ya');
        if (!ya) return;
        try {
            const r = await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}.json`);
            const data = await r.json();
            if (!data) return;
            const menunggu = Object.keys(data).filter(nis => data[nis].status === 'menunggu');
            for (const nis of menunggu) {
                await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}/${nis}.json`, {
                    method: 'PATCH', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ status: 'disetujui', waktu_keputusan: new Date().toLocaleString('id-ID') })
                });
                await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nis}.json`, { method: 'DELETE' });
            }
            tampilkanStatus(`${menunggu.length} disetujui.`, 'sukses');
            lihatPengajuan(mapelId, 'Mapel');
            muatDaftarMapel();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }

    // ======================= EXPORT CSV =======================
    async function unduhHasil(mapelId, namaMapel) {
        try {
            const r = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}.json`);
            const data = await r.json();
            if (!data || Object.keys(data).length === 0) { tampilkanStatus('Belum ada hasil.', 'gagal'); return; }
            const baris = [];
            for (const nis in data) {
                const h = data[nis];
                baris.push({
                    'NISN': nis, 'Nama': h.nama || '', 'Kelas': h.kelas || '',
                    'Benar PG': h.benar_pg || 0, 'Total PG': h.total_pg || 0, 'Nilai PG': h.nilai_pg || 0,
                    'Total Essay': h.total_essay || 0,
                    'Nilai Essay': h.nilai_essay != null ? h.nilai_essay : '',
                    'Nilai Akhir': h.nilai_akhir != null ? h.nilai_akhir : '',
                    'Status': h.status || '', 'Waktu': h.waktu_kirim || ''
                });
            }
            baris.sort((a, b) => (a.Kelas || '').localeCompare(b.Kelas || '') || (a.Nama || '').localeCompare(b.Nama || ''));
            const headers = Object.keys(baris[0]);
            const csv = [headers.join(',')].concat(baris.map(row => headers.map(k => escapeCSV(row[k])).join(','))).join('\n');
            document.getElementById('judul-export').textContent = 'Hasil: ' + namaMapel;
            document.getElementById('isi-export-csv').value = csv;
            document.getElementById('popup-export').classList.add('tampil');
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }
    function copyExportCSV() {
        const ok = copyTextarea('isi-export-csv');
        if (ok) tampilkanStatus('Copy berhasil.', 'sukses'); else alert('Tekan lama textarea lalu copy manual.');
    }

    // ======================= REKAP TOKEN AKTIF =======================
    async function lihatRekapToken() {
        const r = await fetch(`${FIREBASE_URL}/mapel.json`);
        const data = await r.json();
        const aktif = [];
        if (data) for (const id in data) if (data[id].status_aktif && data[id].token) aktif.push(data[id]);
        if (aktif.length === 0) { alert('Belum ada token yang aktif.'); return; }
        aktif.sort((a, b) => (a.nama_mapel || '').localeCompare(b.nama_mapel || ''));

        let teks = '🔑 *DAFTAR TOKEN UJIAN AKTIF*\n';
        teks += 'Tanggal: ' + new Date().toLocaleString('id-ID') + '\n';
        teks += '━━━━━━━━━━━━━━━\n\n';
        aktif.forEach((m, i) => {
            const kelasList = parseKelasList(m.kelas);
            teks += `${i + 1}. *${m.nama_mapel}*\n`;
            teks += `   🏫 Kelas: ${kelasList.join(', ') || '-'}\n`;
            teks += `   🔑 Token: *${m.token}*\n`;
            teks += `   👨‍🏫 Guru: ${m.guru}\n\n`;
        });
        teks += '━━━━━━━━━━━━━━━\n';
        teks += 'Silakan gunakan token sesuai mapel masing-masing.';

        document.getElementById('judul-export').textContent = 'Rekap Token Aktif';
        document.getElementById('isi-export-csv').value = teks;
        document.getElementById('popup-export').classList.add('tampil');
    }

    // ======================= TAB KELAS =======================
    async function muatKelas() {
        try {
            const r = await fetch(`${FIREBASE_URL}/daftar_kelas.json`);
            const data = await r.json();
            daftarKelas = [];
            if (data) for (const id in data) daftarKelas.push({ id, ...data[id] });
            daftarKelas.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            renderKelas();
        } catch (e) { tampilkanStatus('Gagal memuat kelas.', 'gagal'); }
    }

    function renderKelas() {
        const k = document.getElementById('daftar-kelas');
        if (daftarKelas.length === 0) { k.innerHTML = '<p class="kosong">Belum ada kelas.</p>'; return; }
        k.innerHTML = daftarKelas.map(c => `
            <div class="kelas-item">
                <span>${escapeHtml(c.nama)}</span>
                <button class="btn-bahaya" onclick="hapusKelas('${c.id}','${escapeHtml(c.nama)}')" style="flex:0;padding:8px 12px;">Hapus</button>
            </div>`).join('');
    }

    async function tambahKelas() {
        const nama = document.getElementById('input-nama-kelas').value.trim();
        if (!nama) { tampilkanStatus('Nama kelas wajib diisi.', 'gagal'); return; }
        if (daftarKelas.some(c => c.nama.toLowerCase() === nama.toLowerCase())) {
            tampilkanStatus('Kelas sudah ada.', 'gagal'); return;
        }
        try {
            await fetch(`${FIREBASE_URL}/daftar_kelas.json`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ nama })
            });
            document.getElementById('input-nama-kelas').value = '';
            tampilkanStatus('Kelas ditambahkan.', 'sukses');
            muatKelas();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }

    async function hapusKelas(id, nama) {
        const ya = await konfirmasi(`Hapus kelas "${nama}"?`, 'Hapus', 'Ya');
        if (!ya) return;
        try {
            await fetch(`${FIREBASE_URL}/daftar_kelas/${id}.json`, { method: 'DELETE' });
            tampilkanStatus('Kelas dihapus.', 'sukses');
            muatKelas();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }

    // ======================= TAB GURU =======================
    async function muatDaftarGuru() {
        try {
            const r = await fetch(`${FIREBASE_URL}/users_guru.json`);
            const data = await r.json();
            daftarGuru = [];
            if (data) for (const u in data) daftarGuru.push({ username: u, ...data[u] });
            renderDaftarGuru();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }
    function renderDaftarGuru() {
        const k = document.getElementById('daftar-guru');
        if (daftarGuru.length === 0) { k.innerHTML = '<p class="kosong">Belum ada akun guru.</p>'; return; }
        k.innerHTML = daftarGuru.map(g => `
            <div class="card">
                <div class="card-header">
                    <div><b>${escapeHtml(g.nama || g.username)}</b><span>Username: ${escapeHtml(g.username)}</span></div>
                </div>
                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="editGuru('${escapeHtml(g.username)}')">Edit</button>
                    <button class="btn-bahaya" onclick="hapusGuru('${escapeHtml(g.username)}')">Hapus</button>
                </div>
            </div>`).join('');
    }
    function resetFormGuru() {
        ['input-username-guru','input-nama-guru','input-password-guru'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('input-username-guru').disabled = false;
        document.getElementById('judul-form-guru').textContent = 'Tambah Akun Guru';
    }
    function editGuru(u) {
        const g = daftarGuru.find(x => x.username === u);
        if (!g) return;
        document.getElementById('input-username-guru').value = g.username;
        document.getElementById('input-nama-guru').value = g.nama || '';
        document.getElementById('input-password-guru').value = g.password || '';
        document.getElementById('input-username-guru').disabled = true;
        document.getElementById('judul-form-guru').textContent = 'Edit Akun Guru';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    async function simpanGuru() {
        const u = document.getElementById('input-username-guru').value.trim().toLowerCase();
        const n = document.getElementById('input-nama-guru').value.trim();
        const p = document.getElementById('input-password-guru').value.trim();
        if (!u || !n || !p) { tampilkanStatus('Lengkapi semua field.', 'gagal'); return; }
        if (!/^[a-z0-9_.-]+$/.test(u)) { tampilkanStatus('Username tidak valid.', 'gagal'); return; }
        try {
            await fetch(`${FIREBASE_URL}/users_guru/${u}.json`, {
                method: 'PUT', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ username: u, nama: n, password: p })
            });
            tampilkanStatus('Tersimpan.', 'sukses');
            resetFormGuru();
            muatDaftarGuru();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }
    async function hapusGuru(u) {
        const ya = await konfirmasi(`Hapus akun guru "${u}"?`, 'Hapus', 'Ya');
        if (!ya) return;
        try {
            await fetch(`${FIREBASE_URL}/users_guru/${u}.json`, { method: 'DELETE' });
            tampilkanStatus('Dihapus.', 'sukses');
            muatDaftarGuru();
        } catch (e) { tampilkanStatus('Gagal.', 'gagal'); }
    }

    // ======================= INIT =======================
    ambilParamAtauTanya();
    muatDaftarMapel();
</script>
