<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  window.addEventListener('load', () => {
    if (typeof XLSX === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
      document.head.appendChild(s);
    }
  });
</script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #b9fbc0 0%, #70e000 100%);
        min-height: 100vh; color: #1C1C1E; padding: 16px; -webkit-font-smoothing: antialiased;
    }
    .app-container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; padding: 8px 0 4px; }
    header h1 { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
    header p { font-size: 13px; color: #14532d; margin-top: 4px; }
    .tab-nav { display: flex; gap: 8px; background: rgba(255,255,255,0.55); padding: 6px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.8); }
    .tab-nav button {
        flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 600; font-size: 14px;
        background: transparent; color: #14532d; cursor: pointer;
    }
    .tab-nav button.aktif { background: #1b5e20; color: #fff; }
    .card {
        background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 18px; padding: 16px;
        box-shadow: 0 8px 32px rgba(0, 100, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        display: flex; flex-direction: column; gap: 10px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-header b { font-size: 15px; color: #0f172a; }
    .card-header span { font-size: 12px; color: #475569; display: block; margin-top: 2px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .badge-aktif { background: #dcfce7; color: #166534; }
    .badge-nonaktif { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .kotak-token {
        background: rgba(27,94,32,0.08); border: 1px dashed #1b5e20; border-radius: 10px;
        padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .kotak-token .kode { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #14532d; }
    .btn-utama, .btn-sekunder, .btn-bahaya {
        padding: 12px 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
        cursor: pointer; transition: transform 0.15s ease; text-align: center;
    }
    .btn-utama { background: #1b5e20; color: #fff; }
    .btn-utama:active { transform: scale(0.97); background: #14532d; }
    .btn-sekunder { background: rgba(255,255,255,0.85); color: #1b5e20; border: 1px solid #1b5e20; }
    .btn-sekunder:active { transform: scale(0.97); }
    .btn-bahaya { background: #fff; color: #b91c1c; border: 1px solid rgba(185,28,28,0.4); }
    .btn-bahaya:active { transform: scale(0.97); }
    .baris-tombol { display: flex; gap: 8px; flex-wrap: wrap; }
    .baris-tombol > * { flex: 1; min-width: 110px; }
    .kosong { text-align: center; font-size: 13px; color: #475569; padding: 30px 0; }
    .pesan-status { display: none; font-size: 13px; padding: 10px 12px; border-radius: 10px; text-align: center; }
    .pesan-status.tampil { display: block; }
    .pesan-status.sukses { background: rgba(220,252,231,0.9); color: #166534; }
    .pesan-status.gagal { background: rgba(254,226,226,0.9); color: #991b1b; }
    .pesan-status.info { background: rgba(219,234,254,0.9); color: #1e40af; }
    .info-hasil { font-size: 12px; color: #14532d; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #14532d; margin-bottom: 6px; }
    .field input {
        width: 100%; padding: 12px 14px; border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.8);
        font-size: 15px; color: #0f172a; outline: none; font-family: inherit;
    }
    .field input:focus { border-color: #1b5e20; background:#fff; }
    .popup-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
        justify-content: center; align-items: center; padding: 20px; z-index: 999;
    }
    .popup-overlay.tampil { display: flex; }
    .popup-box {
        background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 440px;
        max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .popup-box h3 { font-size: 17px; color: #0f172a; }
    .item-siswa {
        background: rgba(241,245,249,0.9); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .item-siswa b { font-size: 14px; color: #0f172a; }
    .item-siswa span { font-size: 12px; color: #475569; }
    .item-siswa .baris-tombol button { padding: 8px 10px; font-size: 13px; }
    .statistik { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #14532d; }
    .statistik span { background: rgba(255,255,255,0.85); padding: 3px 9px; border-radius: 8px; }
    .item-mapel-baris { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Dashboard Admin</h1>
        <p id="info-admin">Selamat datang</p>
    </header>

    <div class="pesan-status" id="pesan-status"></div>

    <div class="tab-nav">
        <button id="tab-btn-mapel" class="aktif" onclick="gantiTab('mapel')">📚 Mapel</button>
        <button id="tab-btn-guru" onclick="gantiTab('guru')">👤 Akun Guru</button>
    </div>

    <!-- TAB MAPEL -->
    <div id="tab-mapel">
        <div id="daftar-mapel"></div>
    </div>

    <!-- TAB AKUN GURU -->
    <div id="tab-guru" style="display:none; flex-direction:column; gap:16px;">
        <div class="card">
            <h3 id="judul-form-guru" style="color:#0f172a;font-size:16px;">Tambah Akun Guru</h3>
            <div class="field">
                <label>Username (untuk login)</label>
                <input type="text" id="input-username-guru" placeholder="mis. budi">
            </div>
            <div class="field">
                <label>Nama Lengkap</label>
                <input type="text" id="input-nama-guru" placeholder="mis. Budi Santoso, S.Pd.">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="text" id="input-password-guru" placeholder="password guru">
            </div>
            <div class="baris-tombol">
                <button class="btn-sekunder" onclick="resetFormGuru()">Batal / Reset</button>
                <button class="btn-utama" onclick="simpanGuru()">Simpan Akun</button>
            </div>
        </div>
        <div id="daftar-guru"></div>
    </div>
</div>

<!-- POPUP PENGERJAAN SISWA -->
<div class="popup-overlay" id="popup-pengerjaan">
    <div class="popup-box">
        <h3 id="judul-pengerjaan">Daftar Pengerjaan</h3>
        <div id="daftar-pengerjaan"></div>
        <button class="btn-sekunder" onclick="tutupPopup('popup-pengerjaan')">Tutup</button>
    </div>
</div>

<!-- POPUP PENGAJUAN UJIAN ULANG -->
<div class="popup-overlay" id="popup-pengajuan">
    <div class="popup-box">
        <h3 id="judul-pengajuan">Pengajuan Ujian Ulang</h3>
        <div id="daftar-pengajuan"></div>
        <button class="btn-sekunder" onclick="tutupPopup('popup-pengajuan')">Tutup</button>
    </div>
</div>

<!-- POPUP INPUT NILAI ESSAY -->
<div class="popup-overlay" id="popup-nilai-essay">
    <div class="popup-box">
        <h3 id="judul-nilai-essay">Nilai Essay</h3>
        <div id="isi-nilai-essay"></div>
        <div class="baris-tombol">
            <button class="btn-sekunder" onclick="tutupPopup('popup-nilai-essay')">Batal</button>
            <button class="btn-utama" onclick="simpanNilaiEssay()">Simpan Nilai</button>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://ujian-smk-6c744-default-rtdb.firebaseio.com";

    let usernameAdmin = "";
    let namaAdmin = "";
    let daftarMapel = [];
    let daftarGuru = [];

    let konteksNilaiEssay = { mapelId: null, nisn: null };

    function ambilParamAtauTanya() {
        const params = new URLSearchParams(window.location.search);
        usernameAdmin = (params.get('username') || '').trim().toLowerCase();
        namaAdmin = params.get('nama') || '';
        if (!usernameAdmin) {
            usernameAdmin = (prompt('Testing: masukkan username admin') || '').trim().toLowerCase();
            namaAdmin = usernameAdmin;
        }
        document.getElementById('info-admin').textContent = 'Selamat datang, ' + (namaAdmin || usernameAdmin);
    }

    function tampilkanStatus(pesan, jenis = 'info') {
        const kotak = document.getElementById('pesan-status');
        kotak.textContent = pesan;
        kotak.className = 'pesan-status tampil ' + jenis;
        setTimeout(() => kotak.classList.remove('tampil'), 3500);
    }

    function buatTokenAcak() {
        const karakter = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let hasil = '';
        for (let i = 0; i < 6; i++) hasil += karakter.charAt(Math.floor(Math.random() * karakter.length));
        return hasil;
    }

    function escapeHtml(teks) {
        const div = document.createElement('div');
        div.textContent = teks == null ? '' : teks;
        return div.innerHTML;
    }

    function gantiTab(tab) {
        document.getElementById('tab-btn-mapel').classList.toggle('aktif', tab === 'mapel');
        document.getElementById('tab-btn-guru').classList.toggle('aktif', tab === 'guru');
        document.getElementById('tab-mapel').style.display = tab === 'mapel' ? 'block' : 'none';
        document.getElementById('tab-guru').style.display = tab === 'guru' ? 'flex' : 'none';
        if (tab === 'guru') muatDaftarGuru();
    }

    function tutupPopup(id) { document.getElementById(id).classList.remove('tampil'); }

    // ======================================================
    // TAB MAPEL
    // ======================================================

    async function muatDaftarMapel() {
        try {
            const [resMapel, resHasil, resUlang] = await Promise.all([
                fetch(`${FIREBASE_URL}/mapel.json`),
                fetch(`${FIREBASE_URL}/hasil_ujian.json`),
                fetch(`${FIREBASE_URL}/pengajuan_ulang.json`)
            ]);
            const data = await resMapel.json();
            const dataHasil = await resHasil.json();
            const dataUlang = await resUlang.json();
            daftarMapel = [];
            if (data) {
                for (const id in data) {
                    const hasilMapel = dataHasil ? dataHasil[id] : null;
                    const ulangMapel = dataUlang ? dataUlang[id] : null;
                    let jumlahPengajuanMenunggu = 0;
                    if (ulangMapel) {
                        for (const nis in ulangMapel) {
                            if (ulangMapel[nis].status === 'menunggu') jumlahPengajuanMenunggu++;
                        }
                    }
                    daftarMapel.push({
                        id, ...data[id],
                        jumlah_hasil: hasilMapel ? Object.keys(hasilMapel).length : 0,
                        jumlah_pengajuan_menunggu: jumlahPengajuanMenunggu
                    });
                }
            }
            renderDaftarMapel();
        } catch (err) {
            tampilkanStatus('Gagal memuat daftar mapel.', 'gagal');
        }
    }

    function renderDaftarMapel() {
        const kontainer = document.getElementById('daftar-mapel');
        if (daftarMapel.length === 0) {
            kontainer.innerHTML = '<p class="kosong">Belum ada mapel yang dibuat guru.</p>';
            return;
        }
        kontainer.innerHTML = daftarMapel.map(m => `
            <div class="card">
                <div class="card-header">
                    <div>
                        <b>${escapeHtml(m.nama_mapel)}</b>
                        <span>${escapeHtml(m.kelas)} &middot; Guru: ${escapeHtml(m.guru)}</span>
                    </div>
                    <span class="badge ${m.status_aktif ? 'badge-aktif' : 'badge-nonaktif'}">
                        ${m.status_aktif ? 'Aktif' : 'Nonaktif'}
                    </span>
                </div>

                <div class="statistik">
                    <span>${m.jumlah_pg || 0} soal PG</span>
                    <span>${m.jumlah_essay || 0} soal Essay</span>
                    <span>${m.jumlah_hasil} siswa mengumpulkan</span>
                    ${m.jumlah_pengajuan_menunggu > 0
                        ? `<span class="badge badge-info">${m.jumlah_pengajuan_menunggu} pengajuan ulang</span>`
                        : ''}
                </div>

                ${m.status_aktif && m.token ? `
                    <div class="kotak-token">
                        <span>Token ujian:</span>
                        <span class="kode">${m.token}</span>
                    </div>
                ` : ''}

                <div class="baris-tombol">
                    ${m.status_aktif
                        ? `<button class="btn-bahaya" onclick="nonaktifkanMapel('${m.id}')">Nonaktifkan</button>
                           <button class="btn-sekunder" onclick="rilisTokenBaru('${m.id}', '${escapeHtml(m.nama_mapel)}')">Ganti Token</button>`
                        : `<button class="btn-utama" onclick="rilisTokenBaru('${m.id}', '${escapeHtml(m.nama_mapel)}')">Rilis Token</button>`
                    }
                </div>

                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="lihatPengerjaan('${m.id}', '${escapeHtml(m.nama_mapel)}')">👥 Lihat Pengerjaan</button>
                    <button class="btn-sekunder" onclick="lihatPengajuan('${m.id}', '${escapeHtml(m.nama_mapel)}')">📩 Persetujuan Ulang</button>
                </div>

                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="unduhHasil('${m.id}', '${escapeHtml(m.nama_mapel)}')">📊 Unduh Hasil (Excel)</button>
                    <button class="btn-bahaya" onclick="hapusMapelAdmin('${m.id}', '${escapeHtml(m.nama_mapel)}')">🗑️ Hapus Mapel</button>
                </div>
            </div>
        `).join('');
    }

    async function rilisTokenBaru(mapelId, namaMapel) {
        const token = buatTokenAcak();
        if (!confirm(`Rilis token baru untuk "${namaMapel}"?\nToken: ${token}`)) return;
        try {
            await fetch(`${FIREBASE_URL}/mapel/${mapelId}.json`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status_aktif: true, token })
            });
            tampilkanStatus(`Token untuk "${namaMapel}" berhasil dirilis: ${token}`, 'sukses');
            muatDaftarMapel();
        } catch (err) { tampilkanStatus('Gagal merilis token.', 'gagal'); }
    }

    async function nonaktifkanMapel(mapelId) {
        if (!confirm('Nonaktifkan mapel ini?')) return;
        try {
            await fetch(`${FIREBASE_URL}/mapel/${mapelId}.json`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status_aktif: false, token: '' })
            });
            tampilkanStatus('Mapel dinonaktifkan.', 'sukses');
            muatDaftarMapel();
        } catch (err) { tampilkanStatus('Gagal menonaktifkan mapel.', 'gagal'); }
    }

    async function hapusMapelAdmin(mapelId, namaMapel) {
        if (!confirm(`Hapus mapel "${namaMapel}"?\nSemua soal, hasil ujian, dan pengajuan ulang mapel ini akan terhapus permanen.`)) return;
        try {
            await fetch(`${FIREBASE_URL}/mapel/${mapelId}.json`, { method: 'DELETE' });
            await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}.json`, { method: 'DELETE' });
            await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}.json`, { method: 'DELETE' });
            tampilkanStatus('Mapel berhasil dihapus.', 'sukses');
            muatDaftarMapel();
        } catch (err) { tampilkanStatus('Gagal menghapus mapel.', 'gagal'); }
    }

    // ======================================================
    // LIHAT PENGERJAAN SISWA
    // ======================================================

    async function lihatPengerjaan(mapelId, namaMapel) {
        document.getElementById('judul-pengerjaan').textContent = 'Pengerjaan: ' + namaMapel;
        const kontainer = document.getElementById('daftar-pengerjaan');
        kontainer.innerHTML = '<p class="kosong">Memuat...</p>';
        document.getElementById('popup-pengerjaan').classList.add('tampil');

        try {
            const res = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}.json`);
            const data = await res.json();
            if (!data || Object.keys(data).length === 0) {
                kontainer.innerHTML = '<p class="kosong">Belum ada siswa yang mengumpulkan.</p>';
                return;
            }
            const list = Object.keys(data).map(nis => ({ nis, ...data[nis] }));
            list.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));

            kontainer.innerHTML = list.map(h => {
                const statusBadge = h.status === 'menunggu_penilaian'
                    ? '<span class="badge badge-info">Menunggu Nilai Essay</span>'
                    : '<span class="badge badge-aktif">Selesai Dinilai</span>';
                const nilaiEssay = (h.nilai_essay == null) ? '-' : h.nilai_essay;
                const nilaiAkhir = (h.nilai_akhir == null) ? '-' : h.nilai_akhir;
                return `
                    <div class="item-siswa">
                        <div><b>${escapeHtml(h.nama || '-')}</b> ${statusBadge}</div>
                        <span>NISN: ${escapeHtml(h.nis || '-')} &middot; ${escapeHtml(h.kelas || '-')}</span>
                        <span>Waktu kirim: ${escapeHtml(h.waktu_kirim || '-')}</span>
                        <div class="statistik">
                            <span>Benar PG: ${h.benar_pg || 0} / ${h.total_pg || 0}</span>
                            <span>Nilai PG: ${h.nilai_pg || 0}</span>
                            <span>Nilai Essay: ${nilaiEssay}</span>
                            <span>Nilai Akhir: ${nilaiAkhir}</span>
                        </div>
                        ${h.total_essay > 0 ? `
                            <div class="baris-tombol">
                                <button class="btn-sekunder" onclick="bukaNilaiEssay('${mapelId}','${escapeHtml(h.nis)}')">✍️ Nilai Essay</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        } catch (err) {
            kontainer.innerHTML = '<p class="kosong">Gagal memuat data.</p>';
        }
    }

    // ======================================================
    // INPUT NILAI ESSAY
    // ======================================================

    async function bukaNilaiEssay(mapelId, nisn) {
        konteksNilaiEssay = { mapelId, nisn };
        document.getElementById('judul-nilai-essay').textContent = 'Penilaian Essay — ' + nisn;
        const kontainer = document.getElementById('isi-nilai-essay');
        kontainer.innerHTML = '<p class="kosong">Memuat...</p>';
        document.getElementById('popup-nilai-essay').classList.add('tampil');

        try {
            const [resSoal, resHasil] = await Promise.all([
                fetch(`${FIREBASE_URL}/mapel/${mapelId}/soal.json`),
                fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`)
            ]);
            const soal = await resSoal.json() || {};
            const hasil = await resHasil.json() || {};
            const jawabanEssay = hasil.jawaban_essay || {};

            let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
            let ada = 0;
            for (const sid in soal) {
                if (soal[sid].tipe !== 'essay') continue;
                ada++;
                const jwb = jawabanEssay[sid] || '(tidak dijawab)';
                const kunci = soal[sid].kunci_essay ? `Kunci: ${escapeHtml(soal[sid].kunci_essay)}` : '';
                html += `
                    <div class="item-siswa">
                        <b>${escapeHtml(soal[sid].pertanyaan)}</b>
                        ${kunci ? `<span style="color:#166534;">${kunci}</span>` : ''}
                        <div style="background:#fff;border-radius:8px;padding:8px;font-size:13px;color:#0f172a;">
                            ${escapeHtml(jwb)}
                        </div>
                    </div>`;
            }
            if (ada === 0) html += '<p class="kosong">Mapel ini tidak punya soal essay.</p>';
            html += `
                <div class="field">
                    <label>Nilai Essay (0-100)</label>
                    <input type="number" id="input-nilai-essay" min="0" max="100"
                        value="${hasil.nilai_essay != null ? hasil.nilai_essay : ''}"
                        style="text-align:center;letter-spacing:normal;text-transform:none;font-weight:700;">
                </div>
                <p style="font-size:12px;color:#475569;">
                    Nilai akhir akan dihitung dari rata-rata berbobot jumlah soal PG dan Essay.
                </p>
            </div>`;
            kontainer.innerHTML = html;
        } catch (err) {
            kontainer.innerHTML = '<p class="kosong">Gagal memuat.</p>';
        }
    }

    async function simpanNilaiEssay() {
        const { mapelId, nisn } = konteksNilaiEssay;
        if (!mapelId || !nisn) return;
        const nilai = parseInt(document.getElementById('input-nilai-essay').value, 10);
        if (isNaN(nilai) || nilai < 0 || nilai > 100) { alert('Nilai harus 0-100.'); return; }

        try {
            const res = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`);
            const hasil = await res.json() || {};
            const totalPg = hasil.total_pg || 0;
            const totalEssay = hasil.total_essay || 0;
            const nilaiPg = hasil.nilai_pg || 0;

            let nilaiAkhir;
            if (totalPg + totalEssay === 0) nilaiAkhir = 0;
            else nilaiAkhir = Math.round((nilaiPg * totalPg + nilai * totalEssay) / (totalPg + totalEssay));

            await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nilai_essay: nilai, nilai_akhir: nilaiAkhir, status: 'selesai' })
            });
            tutupPopup('popup-nilai-essay');
            tampilkanStatus('Nilai essay tersimpan.', 'sukses');
            lihatPengerjaan(mapelId, 'Mapel');
        } catch (err) {
            alert('Gagal menyimpan nilai.');
        }
    }

    // ======================================================
    // PERSETUJUAN UJIAN ULANG
    // ======================================================

    async function lihatPengajuan(mapelId, namaMapel) {
        document.getElementById('judul-pengajuan').textContent = 'Pengajuan Ujian Ulang: ' + namaMapel;
        const kontainer = document.getElementById('daftar-pengajuan');
        kontainer.innerHTML = '<p class="kosong">Memuat...</p>';
        document.getElementById('popup-pengajuan').classList.add('tampil');

        try {
            const res = await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}.json`);
            const data = await res.json();
            if (!data || Object.keys(data).length === 0) {
                kontainer.innerHTML = '<p class="kosong">Tidak ada pengajuan ujian ulang.</p>';
                return;
            }
            const list = Object.keys(data).map(nis => ({ nis, ...data[nis] }));
            list.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            const adaMenunggu = list.some(p => p.status === 'menunggu');

            let html = '';
            if (adaMenunggu) {
                html += `<div class="baris-tombol">
                    <button class="btn-utama" onclick="setujuiSemua('${mapelId}')">✅ Setujui Semua yang Menunggu</button>
                </div>`;
            }
            html += list.map(p => {
                let badge = '';
                let aksi = '';
                if (p.status === 'menunggu') {
                    badge = '<span class="badge badge-info">Menunggu</span>';
                    aksi = `
                        <div class="baris-tombol">
                            <button class="btn-bahaya" onclick="putuskanUlang('${mapelId}','${escapeHtml(p.nis)}','ditolak')">Tolak</button>
                            <button class="btn-utama" onclick="putuskanUlang('${mapelId}','${escapeHtml(p.nis)}','disetujui')">Setujui</button>
                        </div>`;
                } else if (p.status === 'disetujui') badge = '<span class="badge badge-aktif">Disetujui</span>';
                else badge = '<span class="badge badge-nonaktif">Ditolak</span>';

                return `
                    <div class="item-siswa">
                        <div><b>${escapeHtml(p.nama || '-')}</b> ${badge}</div>
                        <span>NISN: ${escapeHtml(p.nis || '-')} &middot; ${escapeHtml(p.kelas || '-')}</span>
                        <span>Waktu: ${escapeHtml(p.waktu || '-')}</span>
                        ${p.alasan ? `<span>Alasan: ${escapeHtml(p.alasan)}</span>` : ''}
                        ${aksi}
                    </div>
                `;
            }).join('');
            kontainer.innerHTML = html;
        } catch (err) {
            kontainer.innerHTML = '<p class="kosong">Gagal memuat pengajuan.</p>';
        }
    }

    async function putuskanUlang(mapelId, nisn, keputusan) {
        const label = keputusan === 'disetujui' ? 'Setujui' : 'Tolak';
        if (!confirm(`${label} pengajuan ujian ulang dari NISN ${nisn}?`)) return;
        try {
            await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}/${nisn}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: keputusan, waktu_keputusan: new Date().toLocaleString('id-ID') })
            });
            // Kalau disetujui, hapus hasil ujian lama supaya mapel muncul kembali di halaman siswa
            if (keputusan === 'disetujui') {
                await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nisn}.json`, { method: 'DELETE' });
            }
            tampilkanStatus('Keputusan tersimpan.', 'sukses');
            lihatPengajuan(mapelId, 'Mapel');
            muatDaftarMapel();
        } catch (err) { tampilkanStatus('Gagal menyimpan keputusan.', 'gagal'); }
    }

    async function setujuiSemua(mapelId) {
        if (!confirm('Setujui semua pengajuan yang masih menunggu?')) return;
        try {
            const res = await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}.json`);
            const data = await res.json();
            if (!data) return;
            const daftarMenunggu = Object.keys(data).filter(nis => data[nis].status === 'menunggu');
            for (const nis of daftarMenunggu) {
                await fetch(`${FIREBASE_URL}/pengajuan_ulang/${mapelId}/${nis}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'disetujui', waktu_keputusan: new Date().toLocaleString('id-ID') })
                });
                await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}/${nis}.json`, { method: 'DELETE' });
            }
            tampilkanStatus(`${daftarMenunggu.length} pengajuan disetujui.`, 'sukses');
            lihatPengajuan(mapelId, 'Mapel');
            muatDaftarMapel();
        } catch (err) { tampilkanStatus('Gagal menyetujui semua.', 'gagal'); }
    }

    // ======================================================
    // UNDUH HASIL EXCEL
    // ======================================================

    async function unduhHasil(mapelId, namaMapel) {
        try {
            const res = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}.json`);
            const data = await res.json();
            if (!data || Object.keys(data).length === 0) {
                tampilkanStatus('Belum ada hasil untuk mapel ini.', 'gagal');
                return;
            }

            const baris = [];
            for (const nis in data) {
                const h = data[nis];
                baris.push({
                    'NISN': nis,
                    'Nama': h.nama || '',
                    'Kelas': h.kelas || '',
                    'Benar PG': h.benar_pg != null ? h.benar_pg : '',
                    'Total PG': h.total_pg != null ? h.total_pg : '',
                    'Nilai PG': h.nilai_pg != null ? h.nilai_pg : '',
                    'Total Essay': h.total_essay != null ? h.total_essay : '',
                    'Nilai Essay': h.nilai_essay != null ? h.nilai_essay : '',
                    'Nilai Akhir': h.nilai_akhir != null ? h.nilai_akhir : '',
                    'Status': h.status || '',
                    'Waktu Kirim': h.waktu_kirim || ''
                });
            }
            baris.sort((a, b) => (a.Nama || '').localeCompare(b.Nama || ''));

            const namaFile = 'Hasil_' + (namaMapel || 'Ujian').replace(/[^a-z0-9]/gi, '_') + '.xlsx';

            if (typeof XLSX !== 'undefined') {
                const worksheet = XLSX.utils.json_to_sheet(baris);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, 'Hasil Ujian');
                XLSX.writeFile(workbook, namaFile);
                tampilkanStatus('File Excel berhasil diunduh.', 'sukses');
            } else {
                // Fallback CSV
                const headers = Object.keys(baris[0]);
                const csv = [headers.join(',')]
                    .concat(baris.map(r => headers.map(k => `"${String(r[k]).replace(/"/g,'""')}"`).join(',')))
                    .join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = namaFile.replace('.xlsx', '.csv');
                a.click(); URL.revokeObjectURL(url);
                tampilkanStatus('Library Excel tidak termuat, file diunduh sebagai CSV.', 'info');
            }
        } catch (err) {
            console.error(err);
            tampilkanStatus('Gagal mengunduh hasil.', 'gagal');
        }
    }

    // ======================================================
    // AKUN GURU
    // ======================================================

    async function muatDaftarGuru() {
        try {
            const res = await fetch(`${FIREBASE_URL}/users_guru.json`);
            const data = await res.json();
            daftarGuru = [];
            if (data) for (const u in data) daftarGuru.push({ username: u, ...data[u] });
            renderDaftarGuru();
        } catch (err) { tampilkanStatus('Gagal memuat akun guru.', 'gagal'); }
    }

    function renderDaftarGuru() {
        const kontainer = document.getElementById('daftar-guru');
        if (daftarGuru.length === 0) {
            kontainer.innerHTML = '<p class="kosong">Belum ada akun guru.</p>';
            return;
        }
        kontainer.innerHTML = daftarGuru.map(g => `
            <div class="card">
                <div class="card-header">
                    <div>
                        <b>${escapeHtml(g.nama || g.username)}</b>
                        <span>Username: ${escapeHtml(g.username)}</span>
                    </div>
                </div>
                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="editGuru('${escapeHtml(g.username)}')">Edit</button>
                    <button class="btn-bahaya" onclick="hapusGuru('${escapeHtml(g.username)}')">Hapus</button>
                </div>
            </div>
        `).join('');
    }

    function resetFormGuru() {
        document.getElementById('input-username-guru').value = '';
        document.getElementById('input-nama-guru').value = '';
        document.getElementById('input-password-guru').value = '';
        document.getElementById('input-username-guru').disabled = false;
        document.getElementById('judul-form-guru').textContent = 'Tambah Akun Guru';
    }

    function editGuru(username) {
        const g = daftarGuru.find(x => x.username === username);
        if (!g) return;
        document.getElementById('input-username-guru').value = g.username;
        document.getElementById('input-nama-guru').value = g.nama || '';
        document.getElementById('input-password-guru').value = g.password || '';
        document.getElementById('input-username-guru').disabled = true;
        document.getElementById('judul-form-guru').textContent = 'Edit Akun Guru';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function simpanGuru() {
        const username = document.getElementById('input-username-guru').value.trim().toLowerCase();
        const nama = document.getElementById('input-nama-guru').value.trim();
        const password = document.getElementById('input-password-guru').value.trim();
        if (!username || !nama || !password) {
            tampilkanStatus('Semua field wajib diisi.', 'gagal');
            return;
        }
        if (!/^[a-z0-9_.-]+$/.test(username)) {
            tampilkanStatus('Username hanya boleh huruf kecil, angka, titik, -, _.', 'gagal');
            return;
        }
        try {
            await fetch(`${FIREBASE_URL}/users_guru/${username}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, nama, password })
            });
            tampilkanStatus('Akun guru tersimpan.', 'sukses');
            resetFormGuru();
            muatDaftarGuru();
        } catch (err) { tampilkanStatus('Gagal menyimpan akun guru.', 'gagal'); }
    }

    async function hapusGuru(username) {
        if (!confirm(`Hapus akun guru "${username}"?`)) return;
        try {
            await fetch(`${FIREBASE_URL}/users_guru/${username}.json`, { method: 'DELETE' });
            tampilkanStatus('Akun guru dihapus.', 'sukses');
            muatDaftarGuru();
        } catch (err) { tampilkanStatus('Gagal menghapus akun guru.', 'gagal'); }
    }

    // ---------- INIT ----------
    ambilParamAtauTanya();
    muatDaftarMapel();
</script>
