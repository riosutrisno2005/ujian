<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #b9fbc0 0%, #70e000 100%);
        min-height: 100vh;
        color: #1C1C1E;
        padding: 16px;
        -webkit-font-smoothing: antialiased;
    }
    .app-container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; padding: 8px 0 4px; }
    header h1 { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
    header p { font-size: 13px; color: #14532d; margin-top: 4px; }
    .card {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 18px; padding: 16px;
        box-shadow: 0 8px 32px rgba(0, 100, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        display: flex; flex-direction: column; gap: 10px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-header b { font-size: 15px; color: #0f172a; }
    .card-header span { font-size: 12px; color: #475569; display: block; margin-top: 2px; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .badge-aktif { background: #dcfce7; color: #166534; }
    .badge-nonaktif { background: #fee2e2; color: #991b1b; }
    .kotak-token {
        background: rgba(27,94,32,0.08); border: 1px dashed #1b5e20; border-radius: 10px;
        padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .kotak-token .kode { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #14532d; }
    .btn-utama, .btn-sekunder, .btn-bahaya {
        padding: 12px 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
        cursor: pointer; transition: transform 0.15s ease; text-align: center;
    }
    .btn-utama { background: #1b5e20; color: #fff; }
    .btn-utama:active { transform: scale(0.97); background: #14532d; }
    .btn-sekunder { background: rgba(255,255,255,0.85); color: #1b5e20; border: 1px solid #1b5e20; }
    .btn-sekunder:active { transform: scale(0.97); }
    .btn-bahaya { background: #fff; color: #b91c1c; border: 1px solid rgba(185,28,28,0.4); }
    .btn-bahaya:active { transform: scale(0.97); }
    .baris-tombol { display: flex; gap: 8px; flex-wrap: wrap; }
    .baris-tombol > * { flex: 1; min-width: 110px; }
    .kosong { text-align: center; font-size: 13px; color: #475569; padding: 30px 0; }
    .pesan-status { display: none; font-size: 13px; padding: 10px 12px; border-radius: 10px; text-align: center; }
    .pesan-status.tampil { display: block; }
    .pesan-status.sukses { background: rgba(220,252,231,0.9); color: #166534; }
    .pesan-status.gagal { background: rgba(254,226,226,0.9); color: #991b1b; }
    .info-hasil { font-size: 12px; color: #14532d; }
</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Dashboard Admin</h1>
        <p id="info-admin">Selamat datang</p>
    </header>

    <div class="pesan-status" id="pesan-status"></div>

    <div id="daftar-mapel"></div>
</div>

<script>
    // ==========================================================
    // URL Firebase project final (samakan dengan login pages)
    // ==========================================================
    const FIREBASE_URL = "https://ujian-smk-6c744-default-rtdb.firebaseio.com";

    let usernameAdmin = "";
    let namaAdmin = "";
    let daftarMapel = [];

    function ambilParamAtauTanya() {
        const params = new URLSearchParams(window.location.search);
        usernameAdmin = (params.get('username') || '').trim().toLowerCase();
        namaAdmin = params.get('nama') || '';

        if (!usernameAdmin) {
            usernameAdmin = (prompt('Testing: masukkan username admin') || '').trim().toLowerCase();
            namaAdmin = usernameAdmin;
        }
        document.getElementById('info-admin').textContent = 'Selamat datang, ' + (namaAdmin || usernameAdmin);
    }

    function tampilkanStatus(pesan, jenis) {
        const kotak = document.getElementById('pesan-status');
        kotak.textContent = pesan;
        kotak.className = 'pesan-status tampil ' + jenis;
        setTimeout(() => kotak.classList.remove('tampil'), 3000);
    }

    function buatTokenAcak() {
        const karakter = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // tanpa 0,O,1,I biar tidak ketuker
        let hasil = '';
        for (let i = 0; i < 6; i++) {
            hasil += karakter.charAt(Math.floor(Math.random() * karakter.length));
        }
        return hasil;
    }

    // ---------- MUAT & TAMPILKAN DAFTAR MAPEL ----------

    async function muatDaftarMapel() {
        try {
            const res = await fetch(`${FIREBASE_URL}/mapel.json`);
            const data = await res.json();
            daftarMapel = [];
            if (data) {
                for (const id in data) {
                    daftarMapel.push({ id, ...data[id] });
                }
            }
            // Sekalian cek mana yang sudah ada hasil ujiannya
            const resHasil = await fetch(`${FIREBASE_URL}/hasil_ujian.json`);
            const dataHasil = await resHasil.json();

            daftarMapel.forEach(m => {
                const hasilMapel = dataHasil ? dataHasil[m.id] : null;
                m.jumlah_hasil = hasilMapel ? Object.keys(hasilMapel).length : 0;
            });

            renderDaftarMapel();
        } catch (err) {
            tampilkanStatus('Gagal memuat daftar mapel.', 'gagal');
        }
    }

    function renderDaftarMapel() {
        const kontainer = document.getElementById('daftar-mapel');
        if (daftarMapel.length === 0) {
            kontainer.innerHTML = '<p class="kosong">Belum ada mapel yang dibuat guru.</p>';
            return;
        }

        kontainer.innerHTML = daftarMapel.map(m => `
            <div class="card">
                <div class="card-header">
                    <div>
                        <b>${escapeHtml(m.nama_mapel)}</b>
                        <span>${escapeHtml(m.kelas)} &middot; Guru: ${escapeHtml(m.guru)}</span>
                    </div>
                    <span class="badge ${m.status_aktif ? 'badge-aktif' : 'badge-nonaktif'}">
                        ${m.status_aktif ? 'Aktif' : 'Nonaktif'}
                    </span>
                </div>

                ${m.status_aktif && m.token ? `
                    <div class="kotak-token">
                        <span>Token ujian:</span>
                        <span class="kode">${m.token}</span>
                    </div>
                ` : ''}

                <div class="baris-tombol">
                    ${m.status_aktif
                        ? `<button class="btn-bahaya" onclick="nonaktifkanMapel('${m.id}')">Nonaktifkan</button>
                           <button class="btn-sekunder" onclick="rilisTokenBaru('${m.id}', '${escapeHtml(m.nama_mapel)}')">Ganti Token</button>`
                        : `<button class="btn-utama" onclick="rilisTokenBaru('${m.id}', '${escapeHtml(m.nama_mapel)}')">Rilis Token</button>`
                    }
                </div>

                ${m.jumlah_hasil > 0 ? `
                    <div class="baris-tombol">
                        <span class="info-hasil">${m.jumlah_hasil} siswa sudah mengumpulkan</span>
                        <button class="btn-sekunder" onclick="unduhHasil('${m.id}', '${escapeHtml(m.nama_mapel)}')">Unduh Hasil (Excel)</button>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    // ---------- AKTIFKAN / NONAKTIFKAN TOKEN ----------

    async function rilisTokenBaru(mapelId, namaMapel) {
        const token = buatTokenAcak();
        if (!confirm(`Rilis token baru untuk "${namaMapel}"?\nToken: ${token}\n\nToken lama (jika ada) akan tidak berlaku lagi.`)) return;

        try {
            await fetch(`${FIREBASE_URL}/mapel/${mapelId}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status_aktif: true, token: token })
            });
            tampilkanStatus(`Token untuk "${namaMapel}" berhasil dirilis: ${token}`, 'sukses');
            muatDaftarMapel();
        } catch (err) {
            tampilkanStatus('Gagal merilis token.', 'gagal');
        }
    }

    async function nonaktifkanMapel(mapelId) {
        if (!confirm('Nonaktifkan mapel ini? Siswa tidak akan bisa masuk ujian lagi sampai token baru dirilis.')) return;
        try {
            await fetch(`${FIREBASE_URL}/mapel/${mapelId}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status_aktif: false, token: '' })
            });
            tampilkanStatus('Mapel dinonaktifkan.', 'sukses');
            muatDaftarMapel();
        } catch (err) {
            tampilkanStatus('Gagal menonaktifkan mapel.', 'gagal');
        }
    }

    // ---------- UNDUH HASIL EXCEL ----------

    async function unduhHasil(mapelId, namaMapel) {
        try {
            const res = await fetch(`${FIREBASE_URL}/hasil_ujian/${mapelId}.json`);
            const data = await res.json();

            if (!data) {
                tampilkanStatus('Belum ada hasil untuk mapel ini.', 'gagal');
                return;
            }

            const baris = [];
            for (const nis in data) {
                const h = data[nis];
                baris.push({
                    'NISN': nis,
                    'Nama': h.nama || '',
                    'Nilai': h.nilai !== undefined ? h.nilai : '',
                    'Waktu Kirim': h.waktu_kirim || ''
                });
            }

            const worksheet = XLSX.utils.json_to_sheet(baris);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Hasil Ujian');
            XLSX.writeFile(workbook, `Hasil_${namaMapel.replace(/[^a-z0-9]/gi, '_')}.xlsx`);

            tampilkanStatus('File Excel berhasil diunduh.', 'sukses');
        } catch (err) {
            tampilkanStatus('Gagal mengunduh hasil.', 'gagal');
        }
    }

    function escapeHtml(teks) {
        const div = document.createElement('div');
        div.textContent = teks;
        return div.innerHTML;
    }

    ambilParamAtauTanya();
    muatDaftarMapel();
</script>
</body>
</html>
