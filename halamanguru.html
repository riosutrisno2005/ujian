<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Guru</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #b9fbc0 0%, #70e000 100%);
        min-height: 100vh;
        color: #1C1C1E;
        padding: 16px;
        -webkit-font-smoothing: antialiased;
    }
    .app-container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; padding: 8px 0 4px; }
    header h1 { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
    header p { font-size: 13px; color: #14532d; margin-top: 4px; }
    .card {
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 18px; padding: 18px;
        box-shadow: 0 8px 32px rgba(0, 100, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        display: flex; flex-direction: column; gap: 12px;
    }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #14532d; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
        width: 100%; padding: 12px 14px; border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.8);
        font-size: 15px; color: #0f172a; outline: none; font-family: inherit;
    }
    .field input:focus, .field textarea:focus { border-color: #1b5e20; background: #ffffff; }
    .field textarea { resize: vertical; min-height: 60px; }
    .btn-utama, .btn-sekunder, .btn-bahaya {
        padding: 13px 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
        cursor: pointer; transition: transform 0.15s ease; text-align: center;
    }
    .btn-utama { background: #1b5e20; color: #fff; }
    .btn-utama:active { transform: scale(0.97); background: #14532d; }
    .btn-sekunder { background: rgba(255,255,255,0.85); color: #1b5e20; border: 1px solid #1b5e20; }
    .btn-sekunder:active { transform: scale(0.97); }
    .btn-bahaya { background: #fff; color: #b91c1c; border: 1px solid rgba(185,28,28,0.4); }
    .baris-tombol { display: flex; gap: 10px; flex-wrap: wrap; }
    .baris-tombol > * { flex: 1; min-width: 120px; }
    .item-mapel {
        background: rgba(255,255,255,0.6); border-radius: 14px; padding: 14px 16px;
        display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .item-mapel-info { display: flex; flex-direction: column; gap: 3px; }
    .item-mapel-info b { font-size: 15px; color: #0f172a; }
    .item-mapel-info span { font-size: 12px; color: #475569; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; width: fit-content; }
    .badge-aktif { background: #dcfce7; color: #166534; }
    .badge-nonaktif { background: #fee2e2; color: #991b1b; }
    .item-soal {
        background: rgba(255,255,255,0.6); border-radius: 14px; padding: 12px 14px;
        display: flex; flex-direction: column; gap: 8px;
    }
    .item-soal p { font-size: 14px; color: #0f172a; }
    .item-soal .baris-tombol button { padding: 8px 10px; font-size: 13px; }
    .kosong { text-align: center; font-size: 13px; color: #475569; padding: 20px 0; }
    .pesan-status {
        display: none; font-size: 13px; padding: 10px 12px; border-radius: 10px; text-align: center;
    }
    .pesan-status.tampil { display: block; }
    .pesan-status.sukses { background: rgba(220,252,231,0.9); color: #166534; }
    .pesan-status.gagal { background: rgba(254,226,226,0.9); color: #991b1b; }
    .upload-label {
        display: block; text-align: center; cursor: pointer;
    }
    .popup-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center;
        padding: 20px; z-index: 999;
    }
    .popup-overlay.tampil { display: flex; }
    .popup-box {
        background: #fff; border-radius: 20px; padding: 22px; width: 100%; max-width: 380px;
        max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .popup-box h3 { font-size: 17px; color: #0f172a; }
    .opsi-jawaban { display: flex; align-items: center; gap: 8px; }
    .opsi-jawaban input[type="text"] { flex: 1; }
    .opsi-jawaban input[type="radio"] { width: 18px; height: 18px; accent-color: #1b5e20; }
</style>
</head>
<body>

<div class="app-container" id="app">
    <header>
        <h1>Dashboard Guru</h1>
        <p id="info-guru">Selamat datang</p>
    </header>

    <div class="pesan-status" id="pesan-status"></div>

    <!-- LAYAR 1: DAFTAR MAPEL -->
    <div id="layar-daftar-mapel">
        <div class="card">
            <div class="field">
                <label>Nama Mapel</label>
                <input type="text" id="input-nama-mapel" placeholder="Contoh: Matematika">
            </div>
            <div class="field">
                <label>Kelas</label>
                <input type="text" id="input-kelas" placeholder="Contoh: XII TKJ 1">
            </div>
            <button class="btn-utama" onclick="tambahMapel()">+ Tambah Mapel</button>
        </div>

        <div id="daftar-mapel"></div>
    </div>

    <!-- LAYAR 2: KELOLA SOAL -->
    <div id="layar-kelola-soal" style="display:none;">
        <button class="btn-sekunder" onclick="kembaliKeDaftarMapel()">← Kembali ke Daftar Mapel</button>

        <div class="card">
            <h3 id="judul-mapel-aktif" style="color:#0f172a;"></h3>
            <div class="baris-tombol">
                <button class="btn-utama" onclick="bukaFormSoal()">+ Soal Manual</button>
                <label class="btn-sekunder upload-label">
                    Import Excel
                    <input type="file" id="input-excel" accept=".xlsx,.xls" onchange="prosesFileExcel(event)" hidden>
                </label>
            </div>
            <button class="btn-utama" onclick="rilisSoal()" style="background:#0f6b0f;">🚀 Rilis Soal (Upload)</button>
        </div>

        <div id="daftar-soal"></div>
    </div>
</div>

<!-- POPUP FORM SOAL (tambah/edit) -->
<div class="popup-overlay" id="popup-form-soal">
    <div class="popup-box">
        <h3 id="judul-popup-soal">Tambah Soal</h3>
        <div class="field">
            <label>Pertanyaan</label>
            <textarea id="input-pertanyaan"></textarea>
        </div>
        <div class="field"><label>Pilihan A</label>
            <div class="opsi-jawaban">
                <input type="radio" name="jawaban-benar" value="A" id="radio-a">
                <input type="text" id="input-pilihan-a">
            </div>
        </div>
        <div class="field"><label>Pilihan B</label>
            <div class="opsi-jawaban">
                <input type="radio" name="jawaban-benar" value="B" id="radio-b">
                <input type="text" id="input-pilihan-b">
            </div>
        </div>
        <div class="field"><label>Pilihan C</label>
            <div class="opsi-jawaban">
                <input type="radio" name="jawaban-benar" value="C" id="radio-c">
                <input type="text" id="input-pilihan-c">
            </div>
        </div>
        <div class="field"><label>Pilihan D</label>
            <div class="opsi-jawaban">
                <input type="radio" name="jawaban-benar" value="D" id="radio-d">
                <input type="text" id="input-pilihan-d">
            </div>
        </div>
        <p style="font-size:12px;color:#475569;">Pilih radio button di samping pilihan yang jadi jawaban benar.</p>
        <div class="baris-tombol">
            <button class="btn-sekunder" onclick="tutupFormSoal()">Batal</button>
            <button class="btn-utama" onclick="simpanSoalLokal()">Simpan</button>
        </div>
    </div>
</div>

<script>
    // ==========================================================
    // GANTI dengan URL Firebase project kamu (samakan dengan yang lain)
    // ==========================================================
    const FIREBASE_URL = "https://ujian-smk-6c744-default-rtdb.firebaseio.com";

    let usernameGuru = "";
    let namaGuru = "";
    let daftarMapel = [];
    let mapelAktifId = null;
    let namaMapelAktif = "";
    let daftarSoal = [];      // working copy lokal, belum tentu sudah di-upload
    let soalSedangDiedit = null;

    function ambilParamAtauTanya() {
        const params = new URLSearchParams(window.location.search);
        usernameGuru = (params.get('username') || '').trim().toLowerCase();
        namaGuru = params.get('nama') || '';

        if (!usernameGuru) {
            // fallback untuk testing manual lewat browser
            usernameGuru = (prompt('Testing: masukkan username guru') || '').trim().toLowerCase();
            namaGuru = usernameGuru;
        }
        document.getElementById('info-guru').textContent = 'Selamat datang, ' + (namaGuru || usernameGuru);
    }

    function tampilkanStatus(pesan, jenis) {
        const kotak = document.getElementById('pesan-status');
        kotak.textContent = pesan;
        kotak.className = 'pesan-status tampil ' + jenis;
        setTimeout(() => kotak.classList.remove('tampil'), 3000);
    }

    // ---------- DAFTAR MAPEL ----------

    async function muatDaftarMapel() {
        try {
            const res = await fetch(`${FIREBASE_URL}/mapel.json`);
            const data = await res.json();
            daftarMapel = [];
            if (data) {
                for (const id in data) {
                    if (data[id].guru === usernameGuru) {
                        daftarMapel.push({ id, ...data[id] });
                    }
                }
            }
            renderDaftarMapel();
        } catch (err) {
            tampilkanStatus('Gagal memuat daftar mapel.', 'gagal');
        }
    }

    function renderDaftarMapel() {
        const kontainer = document.getElementById('daftar-mapel');
        if (daftarMapel.length === 0) {
            kontainer.innerHTML = '<p class="kosong">Belum ada mapel. Tambahkan di atas.</p>';
            return;
        }
        kontainer.innerHTML = daftarMapel.map(m => `
            <div class="item-mapel">
                <div class="item-mapel-info">
                    <b>${escapeHtml(m.nama_mapel)}</b>
                    <span>${escapeHtml(m.kelas)}</span>
                    <span class="badge ${m.status_aktif ? 'badge-aktif' : 'badge-nonaktif'}">
                        ${m.status_aktif ? 'Aktif untuk ujian' : 'Belum diaktifkan admin'}
                    </span>
                </div>
                <button class="btn-sekunder" onclick="bukaKelolaSoal('${m.id}', '${escapeHtml(m.nama_mapel)}')">Kelola Soal</button>
            </div>
        `).join('');
    }

    async function tambahMapel() {
        const nama = document.getElementById('input-nama-mapel').value.trim();
        const kelas = document.getElementById('input-kelas').value.trim();
        if (!nama || !kelas) {
            tampilkanStatus('Nama mapel dan kelas wajib diisi.', 'gagal');
            return;
        }
        try {
            await fetch(`${FIREBASE_URL}/mapel.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nama_mapel: nama,
                    kelas: kelas,
                    guru: usernameGuru,
                    status_aktif: false,
                    token: ""
                })
            });
            document.getElementById('input-nama-mapel').value = '';
            document.getElementById('input-kelas').value = '';
            tampilkanStatus('Mapel berhasil ditambahkan.', 'sukses');
            muatDaftarMapel();
        } catch (err) {
            tampilkanStatus('Gagal menambahkan mapel.', 'gagal');
        }
    }

    // ---------- KELOLA SOAL ----------

    async function bukaKelolaSoal(mapelId, namaMapel) {
        mapelAktifId = mapelId;
        namaMapelAktif = namaMapel;
        document.getElementById('judul-mapel-aktif').textContent = namaMapel;
        document.getElementById('layar-daftar-mapel').style.display = 'none';
        document.getElementById('layar-kelola-soal').style.display = 'flex';
        document.getElementById('layar-kelola-soal').style.flexDirection = 'column';
        document.getElementById('layar-kelola-soal').style.gap = '16px';

        try {
            const res = await fetch(`${FIREBASE_URL}/mapel/${mapelId}/soal.json`);
            const data = await res.json();
            daftarSoal = [];
            if (data) {
                for (const id in data) {
                    daftarSoal.push({ id, ...data[id] });
                }
            }
            renderDaftarSoal();
        } catch (err) {
            tampilkanStatus('Gagal memuat soal.', 'gagal');
        }
    }

    function kembaliKeDaftarMapel() {
        mapelAktifId = null;
        daftarSoal = [];
        document.getElementById('layar-kelola-soal').style.display = 'none';
        document.getElementById('layar-daftar-mapel').style.display = 'flex';
        document.getElementById('layar-daftar-mapel').style.flexDirection = 'column';
        document.getElementById('layar-daftar-mapel').style.gap = '16px';
        muatDaftarMapel();
    }

    function renderDaftarSoal() {
        const kontainer = document.getElementById('daftar-soal');
        if (daftarSoal.length === 0) {
            kontainer.innerHTML = '<p class="kosong">Belum ada soal. Tambah manual atau import Excel, lalu tekan Rilis.</p>';
            return;
        }
        kontainer.innerHTML = daftarSoal.map((s, i) => `
            <div class="item-soal">
                <p><b>${i + 1}.</b> ${escapeHtml(s.pertanyaan)}</p>
                <p style="font-size:13px;color:#166534;">Jawaban benar: ${s.jawaban_benar}</p>
                <div class="baris-tombol">
                    <button class="btn-sekunder" onclick="editSoalLokal('${s.id}')">Edit</button>
                    <button class="btn-bahaya" onclick="hapusSoalLokal('${s.id}')">Hapus</button>
                </div>
            </div>
        `).join('');
    }

    function bukaFormSoal() {
        soalSedangDiedit = null;
        document.getElementById('judul-popup-soal').textContent = 'Tambah Soal';
        document.getElementById('input-pertanyaan').value = '';
        document.getElementById('input-pilihan-a').value = '';
        document.getElementById('input-pilihan-b').value = '';
        document.getElementById('input-pilihan-c').value = '';
        document.getElementById('input-pilihan-d').value = '';
        document.querySelectorAll('input[name="jawaban-benar"]').forEach(r => r.checked = false);
        document.getElementById('popup-form-soal').classList.add('tampil');
    }

    function editSoalLokal(id) {
        const soal = daftarSoal.find(s => s.id === id);
        if (!soal) return;
        soalSedangDiedit = id;
        document.getElementById('judul-popup-soal').textContent = 'Edit Soal';
        document.getElementById('input-pertanyaan').value = soal.pertanyaan;
        document.getElementById('input-pilihan-a').value = soal.pilihan[0] || '';
        document.getElementById('input-pilihan-b').value = soal.pilihan[1] || '';
        document.getElementById('input-pilihan-c').value = soal.pilihan[2] || '';
        document.getElementById('input-pilihan-d').value = soal.pilihan[3] || '';
        document.querySelectorAll('input[name="jawaban-benar"]').forEach(r => {
            r.checked = (r.value === soal.jawaban_benar);
        });
        document.getElementById('popup-form-soal').classList.add('tampil');
    }

    function tutupFormSoal() {
        document.getElementById('popup-form-soal').classList.remove('tampil');
    }

    function simpanSoalLokal() {
        const pertanyaan = document.getElementById('input-pertanyaan').value.trim();
        const pilihan = [
            document.getElementById('input-pilihan-a').value.trim(),
            document.getElementById('input-pilihan-b').value.trim(),
            document.getElementById('input-pilihan-c').value.trim(),
            document.getElementById('input-pilihan-d').value.trim()
        ];
        const radioTerpilih = document.querySelector('input[name="jawaban-benar"]:checked');

        if (!pertanyaan || pilihan.some(p => !p) || !radioTerpilih) {
            alert('Lengkapi pertanyaan, semua pilihan, dan pilih jawaban benar.');
            return;
        }

        const dataSoal = { pertanyaan, pilihan, jawaban_benar: radioTerpilih.value };

        if (soalSedangDiedit) {
            const idx = daftarSoal.findIndex(s => s.id === soalSedangDiedit);
            daftarSoal[idx] = { id: soalSedangDiedit, ...dataSoal };
        } else {
            daftarSoal.push({ id: 'soal_' + Date.now(), ...dataSoal });
        }

        renderDaftarSoal();
        tutupFormSoal();
    }

    function hapusSoalLokal(id) {
        if (!confirm('Hapus soal ini? (Baru berlaku setelah tekan Rilis)')) return;
        daftarSoal = daftarSoal.filter(s => s.id !== id);
        renderDaftarSoal();
    }

    // ---------- IMPORT EXCEL ----------
    // Format kolom: Pertanyaan | Pilihan A | Pilihan B | Pilihan C | Pilihan D | Jawaban Benar (A/B/C/D)
    // Baris pertama dianggap header dan dilewati.

    function prosesFileExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const workbook = XLSX.read(e.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const baris = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                let ditambahkan = 0;
                for (let i = 1; i < baris.length; i++) {
                    const b = baris[i];
                    if (!b || !b[0]) continue;
                    const jawaban = String(b[5] || '').trim().toUpperCase();
                    if (!['A', 'B', 'C', 'D'].includes(jawaban)) continue;

                    daftarSoal.push({
                        id: 'soal_' + Date.now() + '_' + i,
                        pertanyaan: String(b[0]).trim(),
                        pilihan: [String(b[1] || '').trim(), String(b[2] || '').trim(), String(b[3] || '').trim(), String(b[4] || '').trim()],
                        jawaban_benar: jawaban
                    });
                    ditambahkan++;
                }
                renderDaftarSoal();
                tampilkanStatus(`${ditambahkan} soal berhasil diimport dari Excel. Jangan lupa tekan Rilis.`, 'sukses');
            } catch (err) {
                tampilkanStatus('Gagal membaca file Excel. Periksa formatnya.', 'gagal');
            }
            event.target.value = '';
        };
        reader.readAsBinaryString(file);
    }

    // ---------- RILIS SOAL ----------

    async function rilisSoal() {
        if (!mapelAktifId) return;
        if (daftarSoal.length === 0) {
            if (!confirm('Daftar soal kosong. Rilis akan mengosongkan soal mapel ini di server. Lanjutkan?')) return;
        }

        const objekSoal = {};
        daftarSoal.forEach(s => {
            objekSoal[s.id] = {
                pertanyaan: s.pertanyaan,
                pilihan: s.pilihan,
                jawaban_benar: s.jawaban_benar
            };
        });

        try {
            await fetch(`${FIREBASE_URL}/mapel/${mapelAktifId}/soal.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(objekSoal)
            });
            tampilkanStatus('Soal berhasil dirilis dan tersedia untuk siswa.', 'sukses');
        } catch (err) {
            tampilkanStatus('Gagal merilis soal. Periksa koneksi internet.', 'gagal');
        }
    }

    function escapeHtml(teks) {
        const div = document.createElement('div');
        div.textContent = teks;
        return div.innerHTML;
    }

    ambilParamAtauTanya();
    muatDaftarMapel();
</script>
</body>
</html>
